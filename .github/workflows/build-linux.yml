name: Build Linux Desktop

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:  # 允许手动触发

# Explicit permissions — the default GITHUB_TOKEN is read-only since the
# 2023 security tightening; release creation needs write on contents.
permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 安装 Linux 系统依赖 (关键步骤)
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libraw-dev libvips-dev libarchive-tools

      # 安装项目依赖
      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          cd client && npm install --legacy-peer-deps && cd ..
          cd server && npm install --legacy-peer-deps && cd ..

      # 构建前端
      - name: Build React Client
        run: npm run build-client

      # 重新编译原生模块 (最关键步骤)
      - name: Rebuild Native Modules
        run: npm run rebuild:electron

      # 打包 Linux 应用
      # --publish never: defer to the explicit Create Release step below.
      # Without this flag, electron-builder auto-publishes when GH_TOKEN is
      # set + on a tag, which previously failed tag-triggered runs.
      - name: Build Linux App (AppImage & Deb)
        run: npx electron-builder --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload Artifacts — the explicit release creation lives in
      # build-desktop.yml (which aggregates Win + Mac + Linux assets into
      # one release). Having two workflows race to create the same tag's
      # release caused 422 'already_exists' collisions.
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FilmGallery-Linux-${{ github.sha }}
          path: |
            dist_v9/*.AppImage
            dist_v9/*.deb
          if-no-files-found: warn
