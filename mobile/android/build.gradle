// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

// Override NDK version to match the locally-installed r27d (27.3.13750724).
// The expo plugin defaults to r27c (27.1.12297006) which is unreachable from
// this network; r27d was installed manually. Setting ext.ndkVersion after the
// plugin apply overrides the default.
ext.ndkVersion = "27.3.13750724"
