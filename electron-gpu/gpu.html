<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FilmLab GPU Worker</title>
    <style> html,body,canvas{ margin:0; padding:0; background:#111; color:#eee; } </style>
  </head>
  <body>
    <canvas id="glc" width="32" height="32"></canvas>
    <!--
      Load the bundled renderer. The bundle inlines shared GLSL + WB gain
      modules so the renderer can run with nodeIntegration:false (sandboxed).
      IPC is routed through window.__gpu (exposed by gpu-preload.js).
      The source file gpu-renderer.js is rebuilt into this bundle by build.js.
    -->
    <script src="gpu-renderer.bundle.js"></script>
  </body>
</html>
