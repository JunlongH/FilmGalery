# Lightweight continuous-integration gate for the core surface (server + shared).
#
# Runs on every pull request and push to main. Tests are a HARD gate
# (regressions fail the build); lint reports (errors fail, warnings do not).
#
# Desktop packaging builds (build-desktop.yml) remain separate and are gated on
# tags. The `mobile` job below runs the TS migration gates (typecheck + jest)
# established by phase 2A.4-T1 Wave 0. Watch-app CI remains deferred until its
# dependency tree stabilises (see docs/phase2-roadmap/phase-2a-foundation.md §2A.4).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install system deps that the postinstall chain needs (libraw-dev for
      # the native package's optional build step; matches build-linux.yml).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libraw-dev libvips-dev

      # Explicit three-step install mirrors build-linux.yml. The root
      # postinstall would also do this, but a previous attempt failed
      # nondeterministically inside the postinstall hook; explicit steps give
      # clearer logs and avoid npm lifecycle env quirks.
      - name: Install root dependencies
        run: npm install --legacy-peer-deps --ignore-scripts
      - name: Install client dependencies
        run: cd client && npm install --legacy-peer-deps
      - name: Install server dependencies
        run: cd server && npm install --legacy-peer-deps

      - name: Lint (errors fail, warnings report)
        run: npm run lint

      # Tests run with JSON output captured as an artifact so failures can be
      # diagnosed without authenticated log access. The exit code still gates
      # the run.
      - name: Test (root jest — shared + server)
        run: |
          mkdir -p /tmp/jest-out
          npm test -- --json --outputFile=/tmp/jest-out/results.json --silent || TEST_FAILED=1
          if [ -f /tmp/jest-out/results.json ]; then
            python3 -c "import json; r=json.load(open('/tmp/jest-out/results.json')); [print(f\"  FAIL {t['name']}: {a['title'] if a.get('status')=='failed' else ''}\") for t in r.get('testResults',[]) for a in t.get('assertionResults',[]) if a.get('status')=='failed']" || true
          fi
          exit ${TEST_FAILED:-0}

      - name: Upload jest results (on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-results-${{ github.run_id }}
          path: /tmp/jest-out/
          if-no-files-found: ignore
          retention-days: 14

  mobile:
    name: Mobile (typecheck + jest + metro bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # NOTE: mobile/package-lock.json is gitignored by repo convention, so
          # we cannot key the npm cache off it. npm install resolves fresh each
          # run. (Revisit if mobile ever commits its lockfile.)

      # mobile is intentionally NOT in the root postinstall chain (root only
      # bootstraps client + server), so install explicitly here. postinstall
      # runs patch-package (react-native-zeroconf android build.gradle bump).
      - name: Install dependencies
        run: npm install

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Test (jest-expo)
        run: npm test

      # Layer E — the strongest automated runtime gate: produces the full
      # Android Hermes bundle, proving all imports resolve (native deps +
      # symlinked workspace packages), worklet plugins transform, and .native
      # extension resolution works. Takes ~90s.
      - name: Metro bundle (expo export)
        run: npx expo export --platform android --output-dir /tmp/mobile-export
