name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.9.0)'
        required: false
        default: 'dev'

# Explicit permissions — the default GITHUB_TOKEN is read-only since the
# 2023 security tightening; release creation needs write on contents.
permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            artifact-name: windows
          - os: macos-latest
            platform: mac
            artifact-name: macos
          - os: ubuntu-latest
            platform: linux
            artifact-name: linux

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install client dependencies
        shell: bash
        run: |
          cd client
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Build client
        run: npm run build-client

      # vite.config.js was once left uncommitted, so CI's `vite build` fell
      # back to the default outDir (client/dist) while electron-builder packs
      # client/build/**/* — producing installers with no frontend. Fail fast.
      - name: Verify client build output
        shell: bash
        run: |
          test -f client/build/index.html || { echo "::error::client/build/index.html missing — check vite.config.js outDir"; exit 1; }
          # A missing <script type="module"> entry in client/index.html makes
          # vite emit ONLY index.html (no JS bundle) → packaged app black-screens.
          ls client/build/assets/*.js >/dev/null 2>&1 || { echo "::error::client/build has no JS bundle — check index.html module entry"; exit 1; }

      - name: Build Electron app (Client-Only)
        run: npx electron-builder --${{ matrix.platform }} --config electron-builder-client-only.json --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact-name }}
          path: |
            dist_v9_client/*.exe
            dist_v9_client/*.dmg
            dist_v9_client/*.AppImage
            dist_v9_client/*.zip
          if-no-files-found: warn

  build-desktop-full:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            artifact-name: windows-full
          - os: macos-latest
            platform: mac
            artifact-name: macos-full
          - os: ubuntu-latest
            platform: linux
            artifact-name: linux-full

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # node-gyp needs Python to compile native modules. The Windows runner
      # image ships Python but node-gyp sometimes can't find it, which then
      # breaks Visual Studio detection downstream ('Could not find any Visual
      # Studio installation to use'). Pin Python explicitly.
      - name: Setup Python (for node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux native build deps (libraw)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libraw-dev libvips-dev

      - name: Install macOS native build deps (libraw)
        if: matrix.platform == 'mac'
        run: brew install libraw vips

      # Skip postinstall on root (it spawns nested installs that fail without
      # system deps on Win/Mac). Explicit sub-installs follow, mirroring ci.yml
      # and build-linux.yml. --legacy-peer-deps is required project-wide.
      # --ignore-scripts also on client/server: the libraw-native `prepare`
      # hook downloads + compiles, which fails on Win/Mac without system deps;
      # we explicitly rebuild for the Electron ABI later via rebuild:electron.
      - name: Install root dependencies
        run: npm install --legacy-peer-deps --ignore-scripts

      - name: Install client dependencies
        shell: bash
        run: |
          cd client
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Install server dependencies
        run: |
          cd server
          npm install --legacy-peer-deps --ignore-scripts

      - name: Build client
        run: npm run build-client

      - name: Verify client build output
        shell: bash
        run: |
          test -f client/build/index.html || { echo "::error::client/build/index.html missing — check vite.config.js outDir"; exit 1; }
          # A missing <script type="module"> entry in client/index.html makes
          # vite emit ONLY index.html (no JS bundle) → packaged app black-screens.
          ls client/build/assets/*.js >/dev/null 2>&1 || { echo "::error::client/build has no JS bundle — check index.html module entry"; exit 1; }

      # libraw-native's prepare script (npm run download-libraw) was skipped
      # by --ignore-scripts above. It's required for rebuild:electron to
      # compile the LibRaw binding from source. Verbose (no || true) so any
      # network/extract failure is visible in the step log.
      - name: Fetch LibRaw source (for native rebuild)
        run: cd packages/@filmgallery/libraw-native && node scripts/download-libraw.js

      - name: Rebuild native modules for Electron ABI
        shell: bash   # force bash on Windows (PowerShell doesn't understand 'set -o pipefail')
        env:
          # On macOS, Homebrew installs libraw to /opt/homebrew/lib but
          # lightdrift-libraw's binding.gyp links '-lraw' without telling
          # the linker where to find it. LIBRARY_PATH is clang/gcc's
          # link-time search path env var (analogous to CPATH for includes).
          LIBRARY_PATH: "${{ matrix.platform == 'mac' && '/opt/homebrew/lib' || '' }}"
        run: npm run rebuild:electron

      # --publish never: electron-builder auto-publishes to GH releases when
      # GH_TOKEN is set + on a tag. That collides with the explicit release
      # step below (and previously failed tag builds on push triggers).
      - name: Build Electron app (Full Version)
        run: npx electron-builder --${{ matrix.platform }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact-name }}
          path: |
            dist_v9/*.exe
            dist_v9/*.dmg
            dist_v9/*.AppImage
            dist_v9/*.zip
          if-no-files-found: warn

  release:
    needs: [build-desktop, build-desktop-full]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu

          TAG="${{ github.ref_name }}"
          REPO="JunlongH/FilmGallery"
          COMMIT_SHA="${{ github.sha }}"
          API="https://api.github.com/repos/${REPO}"

          INSTALLERS=()
          while IFS= read -r f; do
            INSTALLERS+=("$f")
          done < <(find artifacts/ -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.zip" \) | sort)
          echo "Installers to upload (${#INSTALLERS[@]}):"
          printf '  %s\n' "${INSTALLERS[@]}"

          # Delete any existing release for this tag
          echo "Cleaning up any existing release for ${TAG}..."
          EXISTING=$(curl -sfL -H "Authorization: Bearer ${GITHUB_TOKEN}" "${API}/releases/tags/${TAG}" 2>/dev/null || true)
          if [ -n "${EXISTING}" ]; then
            RELEASE_ID=$(echo "${EXISTING}" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
            echo "Deleting existing release id=${RELEASE_ID}"
            curl -sfL -X DELETE -H "Authorization: Bearer ${GITHUB_TOKEN}" "${API}/releases/${RELEASE_ID}" >/dev/null || true
            sleep 2
          fi

          # Create release via GitHub API
          echo "Creating release ${TAG}..."
          python3 -c "import json,os; print(json.dumps({'tag_name':os.environ['TAG'],'target_commitish':os.environ['COMMIT_SHA'],'name':os.environ['TAG'],'draft':False,'prerelease':False}))" > /tmp/release-payload.json
          RESP=$(curl -sfL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            "${API}/releases" \
            -d @/tmp/release-payload.json)

          RELEASE_ID=$(echo "${RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          UPLOAD_URL=$(echo "${RESP}" | python3 -c "import sys,json; print(json.load(sys.stdin)['upload_url'].split('{')[0])")
          echo "Release created: id=${RELEASE_ID}"

          # Upload each asset
          for f in "${INSTALLERS[@]}"; do
            BASENAME=$(basename "$f")
            case "${BASENAME}" in
              *.exe) CT="application/vnd.microsoft.portable-executable" ;;
              *.dmg) CT="application/x-apple-diskimage" ;;
              *.AppImage) CT="application/octet-stream" ;;
              *.deb) CT="application/vnd.debian.binary-package" ;;
              *.zip) CT="application/zip" ;;
              *) CT="application/octet-stream" ;;
            esac
            ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('${BASENAME}'))")
            echo "Uploading ${BASENAME}..."
            curl -sfL -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: ${CT}" \
              "${UPLOAD_URL}?name=${ENCODED_NAME}" \
              --data-binary "@${f}" >/dev/null
            echo "  done"
          done

          echo "Release published: https://github.com/${REPO}/releases/tag/${TAG}"
